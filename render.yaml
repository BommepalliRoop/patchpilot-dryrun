# Render blueprint. Free plan for the dry run: it sleeps after ~15 min idle (RISKS N10) -> run scripts/warmup.sh
# 5 min before the demo; no disk on free, so SQLite resets on every deploy (re-seed). Use starter + disk for the event.
services:
  - type: web
    name: patchpilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - { key: LLM_MODE, value: live }
      - { key: LLM_PROVIDER, value: openai }
      - { key: LLM_MODEL, value: gpt-4.1-mini }   # chat/completions with temperature 0 (reasoning models reject it)
      - { key: GITHUB_MODE, value: live }
      - { key: BOOMI_MODE, value: live }
      - { key: BOOMI_BASE_URL, value: "https://c01-sg.integrate.boomi.com" }
      - { key: BOOMI_B2_PATH, value: /ws/simple/createPatchpilotfinding }
      - { key: BOOMI_B3_PATH, value: /ws/simple/createPatchpilotscansummary }
      - { key: BOOMI_B4_PATH, value: /ws/simple/getPatchpilotcompliance }
      - { key: DEMO_MODE, value: "true" }
      - { key: DEMO_REPO_URL, value: "https://github.com/BommepalliRoop/demo-target" }
      - { key: ALLOWED_REPO_PREFIXES, value: "https://github.com/" }   # any GitHub repo; scanned code runs with a scrubbed env (S2), 20 scans/hour
      - { key: THREAT_INTEL, value: live }
      - { key: FIX_CONCURRENCY, value: "1" }   # 512 MB free plan: one fix venv at a time
      - { key: FRONTEND_URL, value: "https://patchpilot-ruby.vercel.app" }
      - { key: PATCHPILOT_API_KEY, generateValue: true }
      - { key: BOOMI_USER, sync: false }
      - { key: BOOMI_TOKEN, sync: false }
      - { key: LLM_API_KEY, sync: false }   # set in the Render dashboard
      - { key: GITHUB_TOKEN, sync: false }  # set in the Render dashboard
